[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "editpano"
dynamic = ["version"]
description = "EditPano: geometry-consistent, seam-equivariant local editing of 360° ERP panoramas around frozen image editors."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ly-fish" }]
keywords = ["panorama", "360", "equirectangular", "image-editing", "diffusion", "gnomonic-projection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
# The geometric core is deliberately light: no torch, no diffusers.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
edit = [
    "torch>=2.1",
    "diffusers>=0.36",
    "transformers>=4.51",
    "accelerate>=0.30",
]
grounding = ["torch>=2.1", "transformers>=4.51"]
generation = ["torch>=2.1", "diffusers>=0.36", "transformers>=4.51", "peft>=0.12", "sentencepiece", "protobuf"]
eval = ["torch>=2.1", "scikit-image>=0.21", "scipy>=1.10", "lpips>=0.1.4", "ftfy", "regex"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
all = ["editpano[edit,grounding,generation,eval]"]

[project.scripts]
editpano = "editpano.cli:main"

[project.urls]
Repository = "https://github.com/ly-fish/panorama_editing"

[tool.setuptools.dynamic]
version = { attr = "editpano._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
editpano = ["py.typed"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "requires_torch: needs PyTorch installed",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
packages = ["editpano"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["editpano"]
branch = true
